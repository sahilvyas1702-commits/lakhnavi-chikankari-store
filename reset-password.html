<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#6e2547">
  <title>Reset password | Lakhnavi Chikankari</title>
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="reset-page">
    <section class="reset-shell" aria-labelledby="resetTitle">
      <a class="reset-brand" href="/" aria-label="Return to Lakhnavi Chikankari">
        <img src="logo.svg" alt="Lakhnavi Chikankari">
      </a>
      <div class="modal-card">
        <span class="eyebrow">YOUR ACCOUNT</span>
        <h1 id="resetTitle">Set a new password</h1>
        <p class="modal-note">Choose a new password for your Lakhnavi Chikankari account.</p>
        <form id="resetForm">
          <label>New password<input id="newPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="At least 6 characters"></label>
          <label>Confirm password<input id="confirmPassword" type="password" minlength="6" required autocomplete="new-password" placeholder="Enter it again"></label>
          <button class="btn primary full" id="resetSubmit" type="submit">Update password</button>
          <p class="form-message" id="resetMsg" role="status"></p>
        </form>
        <a class="arrow-link reset-back" href="/">← Back to the shop</a>
      </div>
    </section>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script>
    const config = window.SHOP_CONFIG;
    const client = config && config.SUPABASE_URL && !config.SUPABASE_URL.includes('YOUR-') && window.supabase
      ? window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY)
      : null;

    document.getElementById('resetForm').addEventListener('submit', async event => {
      event.preventDefault();
      const message = document.getElementById('resetMsg');
      const submit = document.getElementById('resetSubmit');
      const password = document.getElementById('newPassword').value;
      const confirmation = document.getElementById('confirmPassword').value;

      if (!client) {
        message.textContent = 'Account login is not configured yet.';
        return;
      }
      if (password !== confirmation) {
        message.textContent = 'The two passwords do not match.';
        return;
      }

      submit.disabled = true;
      message.textContent = 'Updating your password…';
      try {
        const { error } = await client.auth.updateUser({ password });
        message.textContent = error ? error.message : 'Password updated. You can return to the shop and sign in.';
        if (!error) document.getElementById('resetForm').reset();
      } catch (error) {
        message.textContent = error.message || 'Could not update your password. Request a new reset email and try again.';
      } finally {
        submit.disabled = false;
      }
    });
  </script>
</body>
</html>
